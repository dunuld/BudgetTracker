name: CI — Build & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: budget_tracker

jobs:
  build:
    name: Build (Angular + Server)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository klonen
        uses: actions/checkout@v4

      - name: Node.js 24 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: budget_tracker/package-lock.json

      - name: Dependencies installieren
        run: npm ci

      - name: TypeScript-Kompilierung & Build
        run: npm run build:all

  test:
    name: Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: angular
            script: test:coverage
            report: coverage/BudgetTracker
          - suite: server
            script: test:server:coverage
            report: coverage/server

    steps:
      - name: Repository klonen
        uses: actions/checkout@v4

      - name: Node.js 24 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: budget_tracker/package-lock.json

      - name: Dependencies installieren
        run: npm ci

      # Schlägt fehl, wenn ein Test fehlschlägt oder die Coverage unter die Schwelle fällt
      # (Schwellen: server/vitest.config.ts bzw. angular.json → test.options.coverageThresholds).
      - name: Tests mit Coverage ausführen
        run: npm run ${{ matrix.script }}

      - name: Coverage in Job-Zusammenfassung schreiben
        if: ${{ !cancelled() }}
        env:
          REPORT: ${{ matrix.report }}/coverage-summary.json
          SUITE: ${{ matrix.suite }}
        run: |
          [ -f "$REPORT" ] || exit 0
          node -e '
            const t = require(require("node:path").resolve(process.env.REPORT)).total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log([`### Coverage: ${process.env.SUITE}`, "", "| Metrik | % | abgedeckt |", "|---|---|---|",
              ...["lines", "statements", "branches", "functions"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage-Report hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.suite }}
          path: budget_tracker/${{ matrix.report }}
          retention-days: 14
          if-no-files-found: ignore
